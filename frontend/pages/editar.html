<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Mascotas</title>
    <link rel="stylesheet" href="../css/JJM_adiccionar.css"/>
</head>
<body>

  <div class="back">
    <button onclick="RedirectMain()">
      <img src="../assets//btn-back.png" width="15%" />
    </button>
  </div>
  
  <div class="close">
    <button onclick="RedirectMain()">
      <img src="../assets//btn-close.svg" />
    </button>
  </div>

  <h1 class="titulo">Editar Mascota</h1>

  <div class="contenedor-foto">
    <img src="../assets/photo-lg-0.svg" alt="Foto de la mascota"> 
  </div>

  <form id="formularioMascota">
    <div class="formulario-Add">
      <input type="text" placeholder="Nombre" id="nombre" class="input1" required />
      <select name="Raza" id="raza_id">
        <option value="">Selecciona una raza</option>
      </select>
      <select name="Categoria" id="categoria_id">
        <option value="">Selecciona una categoría</option>
      </select>
      
      <button type="button" id="btnSubirFoto">Subir foto</button>
      <input type="file" id="foto" accept="image/*" style="display: none;" required />
      
      <select name="Genero" id="genero_id">
        <option value="">Selecciona un género</option>
      </select>
      
      <input type="text" placeholder="Estado" id="estado" class="input1" required />
      
      <select name="Usuario" id="usuario_id">
        <option value="">Selecciona un usuario</option>
      </select>

      <button type="submit" id="btnGuardarMascota">
        <img src="../assets//btn-save.svg" />
      </button>
    </div>
  </form>

  <script src="../js/JJM_editar.js"></script>
</body>
</html>
