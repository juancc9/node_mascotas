<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Mascotas</title>
  <link rel="stylesheet" href="../css/JJM_adiccionar.css"/>
  <link rel="stylesheet"href="../css/JJM_sideBar.css" />

</head>
<body>
    <div id="sidebar-container"></div>
<button id="toggleBtn" onclick="toggleSidebar()">Abrir Sidebar</button>

  <div class="back">
    <img src="../assets//btn-back.png" type="submit" onclick="RedirectMain()" width="15%" />
    </div>
    <div class="close">
      <img src="../assets//btn-close.svg" type="submit" onclick="RedirectMain()" />
    </div>
<h1 class="titulo">Editar mascota</h1>

        <div class="contenedor-foto">
<img id="preview-img" src="" alt="" style="width: 150px; height: 150px;" />
        </div>  

      <div class="formulario-Add">
    <input type="text" placeholder="Nombre" id="nombre"  class="input1"   required />
<select name="Raza" id="raza_id">
  <option value="">Selecciona una raza</option>
</select>
    <select name="Categoria" id="categoria_id"> <option value="" >Selecciona una categoria</option>

</select>

<button type="button" id="btnSubirFoto" >Subir foto</button>
<input type="file" id="foto" accept="image/*" style="display: none;"placeholder="Subir foto" required  />

    
    <select name="Genero" id="genero_id"> <option value="">Selecciona un genero</option>
</select>


<select id="estado" required>
  <option value="">Selecciona estado</option>
  <option value="Disponible">Disponible</option>
  <option value="Adoptado">Adoptado</option>
</select>


 <select name="usuario" id="usuario_id"> <option value="" >Selecciona un usuario</option>

</select>  
  <img src="../assets//btn-save.svg" type="submit" id="btnGuardar"/>
</div>


<script src="../js/JJM_editar.js"></script>
<scritpt src="../js/JJM_mascotas.js"></scritpt>
<script src="../js/JJM_Buttons.js"></script>
<script src="../js/JJM_sideBar.js"></script>
<script src="../js/JJM_ManejoSideBar.js"></script>
</body>
</html>
